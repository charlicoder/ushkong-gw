services:
  kong-gateway:
    image: kong/kong-gateway:3.14
    container_name: ushspa-kong
    restart: unless-stopped

    environment:
      # DB-less mode
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml

      # Proxy
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr

      # Admin API
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr

      # Listen interfaces
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001

      # Logging
      KONG_LOG_LEVEL: info

    ports:
      # Public/API Gateway
      - "8000:8000"

      # Kong Admin API - local development only
      - "127.0.0.1:8001:8001"

    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro

    networks:
      - ushspa-network

networks:
  ushspa-network:
    external: true
    
    