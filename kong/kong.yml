_format_version: "3.0"
_transform: true

services:
  # ============================================================
  # USHAUTH
  # ============================================================

  - name: ushauth
    url: http://ushauth:8002
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000

    routes:
      - name: ushauth-route
        paths:
          - /uauth
        strip_path: true
        preserve_host: false
        protocols:
          - http
          - https

  # ============================================================
  # USHBOOKNPAY
